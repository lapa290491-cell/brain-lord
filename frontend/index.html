<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>BRAIN-LORD // WAR ROOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <section id="brain-container">
      <canvas id="brain"></canvas>
      <div class="hud">
        <div class="hud-row"><span class="dot"></span><span>НЕЙРОСЕТЬ АКТИВНА</span></div>
        <div class="hud-row dim">АГЕНТОВ ОНЛАЙН: 104</div>
        <div class="hud-row dim" id="hud-pick">УЗЕЛ: —</div>
      </div>
      <div class="hud-br">HITL · NO PUBLISH</div>
    </section>
    <section id="control-panel">
      <header class="cp-head">
        <div><h1>BRAIN-LORD</h1><p>WAR ROOM · СИНДИКАТ СМЫСЛОВ</p></div>
        <span class="badge">v2.0</span>
      </header>
      <div class="block">
        <h2>КЛАНЫ</h2>
        <div class="tabs" id="clans">
          <button class="tab on" data-clan="pm">PM ШТАБ</button>
          <button class="tab" data-clan="mass">ИНЖЕНЕРЫ МАСС</button>
          <button class="tab" data-clan="info">ИНФОПОЛЕ</button>
          <button class="tab" data-clan="osint">OSINT</button>
        </div>
        <p class="clan-note" id="clan-note">CPO · QA · очередь апрува</p>
      </div>
      <div class="block grow">
        <h2>АКТИВНЫЕ ЗАДАЧИ / КАНБАН</h2>
        <div class="kanban">
          <div class="kcol"><span>OSINT</span><b id="k-osint">ожидание брифа</b></div>
          <div class="kcol"><span>ГИПОТЕЗЫ</span><b id="k-hyp">—</b></div>
          <div class="kcol"><span>КОНТЕНТ</span><b id="k-cnt">—</b></div>
          <div class="kcol wait"><span>ОДОБРЕНИЕ</span><b id="k-ok">пусто</b></div>
        </div>
      </div>
      <div class="block">
        <h2>КОНСОЛЬ УПРАВЛЕНИЯ</h2>
        <div class="meters">
          <label>ПРОВОКАЦИЯ <i id="v-prov">30</i></label>
          <input id="prov" type="range" min="0" max="100" value="30">
          <label>ТОН <i id="v-tone">нейтраль</i></label>
          <input id="tone" type="range" min="0" max="100" value="50">
        </div>
        <button id="execute" type="button">EXECUTE</button>
        <pre id="log">ready
hitl locked · публикация выключена</pre>
      </div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
